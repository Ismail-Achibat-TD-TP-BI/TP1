name: Fetch internship offers (Jooble)

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_offers_jooble.py
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      - name: Commit updated offers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offers/raw_offers.json
          git commit -m "Fetch latest offers [automated]" || echo "Nothing to commit"
          git push
